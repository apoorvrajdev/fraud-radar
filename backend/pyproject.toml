[project]
name = "fraud-radar-backend"
version = "0.1.0"
description = "Fraud Radar backend — FastAPI fraud detection service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "xgboost>=3.2.0",
    "scikit-learn>=1.8.0",
    "shap>=0.51.0",
    "pandas>=3.0.3",
    "numpy>=2.4.6",
    "matplotlib>=3.10.9",
    "faker>=40.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "RUF"]
# RUF002/RUF003: docstrings and comments use en dashes, × and σ deliberately.
ignore = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom evaluates Depends()/Query()/… in
# argument defaults on purpose. B008 is a false positive for those calls.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Alembic's template sets sys.path before the model imports on purpose.
"alembic/env.py" = ["E402"]
# `str, Enum` is load-bearing: StrEnum changes str() output, and the enum
# values are serialised straight into API responses and the audit log.
"app/fraud/decision.py" = ["UP042"]
"app/fraud/rules.py" = ["UP042"]
# `X` is the conventional name for a feature matrix.
"app/fraud/explainer.py" = ["N803", "N806"]
# `id` is the domain term for a primary key in the repository API.
"app/repositories/base.py" = ["A002"]
# Test-local sessionmaker/engine factories are class-like by convention,
# and test row builders take `id=` to mirror the repository API.
"tests/**" = ["N806", "A002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
