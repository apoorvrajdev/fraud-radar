name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff, mypy, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # No .env is committed, so this mirrors the Settings default explicitly.
      DATABASE_URL: sqlite:///./fraud_radar.db
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python 3.11 — the declared floor)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      # The ml/ modules are opted in as Phase 5 rewrites them; the older
      # training scripts and the frozen alembic/versions/ stay out for now.
      - name: Lint (ruff)
        run: uv run ruff check app tests alembic/env.py ml/datasets ml/experiments ml/features ml/holdout.py ml/loading.py ml/paths.py ml/promote.py ml/reporting.py ml/run_analysis.py ml/run_card.py ml/run_verification.py ml/runs.py

      - name: Type-check (mypy, strict)
        run: uv run mypy app ml/datasets ml/experiments ml/features ml/holdout.py ml/loading.py ml/paths.py ml/promote.py ml/reporting.py ml/run_analysis.py ml/run_card.py ml/run_verification.py ml/runs.py ml/artifacts.py

      # tests/integration/test_scoring_endpoint.py loads the real model from
      # backend/ml/artifacts/, which is gitignored. Train a deliberately tiny
      # model so those tests run for real instead of skipping. ~1 minute.
      - name: Bootstrap model artifacts
        run: |
          uv run alembic upgrade head
          uv run python -m ml.generate_dataset --n-transactions 3000
          uv run python -m ml.train --n-iter 2

      - name: Tests (pytest)
        run: uv run pytest

  frontend:
    name: Frontend — tsc, vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc)
        run: npx tsc -b

      # VITE_DEMO_MODE mirrors the Vercel demo build, so CI compiles the same
      # code path the public deployment ships.
      - name: Build
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"
