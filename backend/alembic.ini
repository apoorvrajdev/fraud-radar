# Alembic Config

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Template used to generate migration filenames
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Max length of the slug field generated from -m message
truncate_slug_length = 40

# Migration script settings
revision_environment = false
sourceless = false
version_path_separator = os
output_encoding = utf-8

# Database URL is set dynamically in env.py from app config — left blank here
sqlalchemy.url =


[post_write_hooks]
# Placeholder section for future formatting hooks


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S